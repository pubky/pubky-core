[general]
signup_mode = "token_required"
user_storage_quota_mb = 0
# `database_url` is deliberately absent. This file is merged underneath every config read
# from disk, so a value here would apply to servers whose owner never chose a database —
# the homeserver would silently connect to it and run migrations against it. Leaving it
# unset makes "no database configured" an error the operator can see and fix. The setting
# is still documented (commented out) in config.sample.toml.

[drive]
pubky_listen_socket = "127.0.0.1:6287"
icann_listen_socket = "127.0.0.1:6286"

[[drive.rate_limits]]
path = "/signup_tokens/*"
method = "GET"
quota = "10r/m"
key = "ip"

[default_quotas]

[storage]
type = "file_system"

[admin]
enabled = true
listen_socket = "127.0.0.1:6288"
admin_password = "admin"

[metrics]
enabled = false
listen_socket = "127.0.0.1:6289"

[pkdns]
public_ip = "127.0.0.1"
icann_domain = "localhost"
user_keys_republisher_interval = 14400 # 4 hours in seconds
dht_relay_nodes = ["https://pkarr.pubky.app", "https://pkarr.pubky.org"]

[logging]
level = "info"
module_levels = ["pubky_homeserver=debug", "tower_http=debug"]