name: Build Docker Images

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub runner label for the build
        type: string
        default: ubuntu-latest
      cache_scope_suffix:
        description: Optional suffix to isolate caches for separate architecture builds
        type: string
        default: ''
      build_profile:
        description: Docker build profile (debug or release)
        type: string
        default: release
      platforms:
        description: Target platforms for the Docker images
        type: string
        default: |
          linux/arm64
          linux/amd64
      publish:
        description: Publish images to Docker Hub with version and latest tags
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - image: homeserver-testnet
            target: testnet
          - image: homeserver
            target: homeserver
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@e6d3b38b5ebfa97b86595cb44f3a86695e473b09 # v1.0.0
        with:
          registry: registry-1.docker.io/synonymsoft
          context: .
          push: ${{ inputs.publish }}
          latest: ${{ inputs.publish }}
          tags: |
            type=ref,event=tag
          platforms: ${{ inputs.platforms }}
          image: ${{ matrix.image }}
          cache_from: type=gha,scope=docker-${{ inputs.build_profile }}-${{ matrix.target }}${{ inputs.cache_scope_suffix }}
          cache_to: type=gha,scope=docker-${{ inputs.build_profile }}-${{ matrix.target }}${{ inputs.cache_scope_suffix }},mode=max
          build_args: |
            BUILD_TARGET=${{ matrix.target }}
            BUILD_PROFILE=${{ inputs.build_profile }}
